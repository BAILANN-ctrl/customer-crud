services:
  # ---------------------------------------------------------------------
  # database  - MySQL 8 relational database for customer records
  # ---------------------------------------------------------------------
  database:
    image: mysql:8.0
    container_name: customer_database
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: customers_db
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_USER: laravel
      MYSQL_PASSWORD: laravel_secret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # searcher - Elasticsearch, holds the search documents for customers
  # ---------------------------------------------------------------------
  searcher:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.13
    container_name: customer_searcher
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # api - Lumen backend, all customer CRUD + ES sync logic lives here
  # ---------------------------------------------------------------------
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: customer_api
    restart: unless-stopped
    volumes:
      - ./api:/var/www/html
      # Preserve the vendor/ directory built inside the image; without this the
      # ./api bind mount above would shadow /var/www/html/vendor and the API
      # would be unable to boot (no composer autoloader).
      - /var/www/html/vendor
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=customers_db
      - DB_USERNAME=laravel
      - DB_PASSWORD=laravel_secret
      - ELASTICSEARCH_HOST=http://searcher:9200
      - ELASTICSEARCH_INDEX=customers
    depends_on:
      database:
        condition: service_healthy
      searcher:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------
  # controller - Nginx load balancer / reverse proxy in front of the api
  # ---------------------------------------------------------------------
  controller:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: customer_controller
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./api:/var/www/html
    depends_on:
      - api
    networks:
      - app-network

  # ---------------------------------------------------------------------
  # frontend - Angular UI, served via its own Nginx, talks to `controller`
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: customer_frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - controller
    networks:
      - app-network

  # ---------------------------------------------------------------------
  # frontend-tests - one-off runner for the Angular unit tests (Karma + a
  # headless Chromium). Not started by `docker compose up`; run on demand:
  #     docker compose run --rm frontend-tests
  # ---------------------------------------------------------------------
  frontend-tests:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: test
    profiles:
      - tests
    volumes:
      - ./frontend:/app
      # Same trick as `api`: keep the image's compiled node_modules instead of
      # shadowing them with the (empty) host folder.
      - /app/node_modules
    environment:
      - CHROME_BIN=/usr/bin/chromium
    networks:
      - app-network

volumes:
  db_data:
  es_data:

networks:
  app-network:
    driver: bridge
