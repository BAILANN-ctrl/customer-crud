server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Convenience: allow the SPA to call /api/* on its own origin during
    # local docker-compose usage, forwarded straight to the controller.
    location /api/ {
        proxy_pass http://controller:80/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location ~* \.(?:css|js|svg|ico|png|jpg|jpeg|gif|woff2?)$ {
        expires 7d;
        access_log off;
    }
}
